[project]
name = "nametags"
version = "0.0.0"
description = "Nametag printer for Pumping Station: One"
requires-python = ">=3.13"
dependencies = [
    "asgiref>=3.10.0",
    "brother-ql-next>=0.11.3",
    "flask>=3.1.2",
    "keyboard>=0.13.5",
    "pillow>=12.0.0",
    "pyjwt>=2.12.1",
    "requests>=2.33.1",
    "uvicorn>=0.38.0",
    "wand>=0.6.13",
]

[project.scripts]
nametag = "nametags.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.18.2",
    "ruff>=0.11.0",
    "vermin>=1.7.0",
]

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nametags"]
